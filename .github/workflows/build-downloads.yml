name: Build RuntimeX Downloads

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "RuntimeX source ref (branch or tag)"
        required: true
        default: "main"
      version:
        description: "Published version"
        required: true
        default: "1.0.1"

permissions:
  contents: write

concurrency:
  group: build-runtimex-downloads
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Checkout private RuntimeX source
        uses: actions/checkout@v4
        with:
          repository: garzuu/runtimex
          ref: ${{ inputs.source_ref }}
          path: source
          token: ${{ secrets.RUNTIMEX_SOURCE_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Import Developer ID certificate
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$MACOS_CERTIFICATE" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "ci-keychain" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "ci-keychain" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PWD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "ci-keychain" "$KEYCHAIN_PATH"
          echo "Available signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}

      - name: Install dependencies
        run: flutter pub get
        working-directory: source

      - name: Build app bundle
        run: flutter build macos --release
        working-directory: source

      - name: Sign app bundle
        run: |
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain" \
            | grep -o '"[^"]*"' | head -1 | tr -d '"')
          echo "Signing with: $IDENTITY"
          codesign --deep --force --verify --verbose \
            --sign "$IDENTITY" \
            --options runtime \
            --entitlements source/macos/Runner/Release.entitlements \
            source/build/macos/Build/Products/Release/runtimex.app

      - name: Package DMG
        run: |
          mkdir -p dist
          ./source/scripts/macos/create_dmg.sh \
            source/build/macos/Build/Products/Release/runtimex.app \
            dist/RuntimeX-macos.dmg

      - name: Sign DMG
        run: |
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain" \
            | grep -o '"[^"]*"' | head -1 | tr -d '"')
          codesign --force --sign "$IDENTITY" dist/RuntimeX-macos.dmg

      - name: Notarize DMG
        timeout-minutes: 25
        run: |
          SUBMISSION=$(xcrun notarytool submit dist/RuntimeX-macos.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json)
          echo "$SUBMISSION"
          STATUS=$(echo "$SUBMISSION" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))")
          if [ "$STATUS" != "Accepted" ]; then
            echo "Notarization failed or timed out: $STATUS"
            exit 1
          fi
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Staple notarization ticket
        run: xcrun stapler staple dist/RuntimeX-macos.dmg

      - name: Create DMG checksum
        run: shasum -a 256 dist/RuntimeX-macos.dmg > dist/RuntimeX-macos.dmg.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: runtimex-macos
          path: dist/*
          retention-days: 7

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Checkout private RuntimeX source
        uses: actions/checkout@v4
        with:
          repository: garzuu/runtimex
          ref: ${{ inputs.source_ref }}
          path: source
          token: ${{ secrets.RUNTIMEX_SOURCE_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get
        working-directory: source

      - name: Build app bundle
        run: flutter build windows --release
        working-directory: source

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Create installer script
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          @"
          [Setup]
          AppId={{5F8F77A2-6F54-4F3D-9F2C-4C7ABF7E3B5A}}
          AppName=RuntimeX
          AppVersion=$version
          AppPublisher=garzuu
          DefaultDirName={autopf}\RuntimeX
          DefaultGroupName=RuntimeX
          DisableProgramGroupPage=yes
          OutputDir=dist
          OutputBaseFilename=RuntimeX-windows
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64
          WizardStyle=modern
          PrivilegesRequiredOverridesAllowed=dialog

          [Tasks]
          Name: "desktopicon"; Description: "Create a &desktop icon"; GroupDescription: "Additional icons:"; Flags: unchecked

          [Files]
          Source: "source\build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion

          [Icons]
          Name: "{autoprograms}\RuntimeX"; Filename: "{app}\runtimex.exe"
          Name: "{autodesktop}\RuntimeX"; Filename: "{app}\runtimex.exe"; Tasks: desktopicon
          "@ | Set-Content -NoNewline installer.iss

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Create checksum
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 dist\RuntimeX-windows.exe |
            ForEach-Object { "$($_.Hash.ToLower())  dist\RuntimeX-windows.exe" } |
            Set-Content dist\RuntimeX-windows.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: runtimex-windows
          path: dist/*
          retention-days: 7

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Checkout private RuntimeX source
        uses: actions/checkout@v4
        with:
          repository: garzuu/runtimex
          ref: ${{ inputs.source_ref }}
          path: source
          token: ${{ secrets.RUNTIMEX_SOURCE_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get
        working-directory: source

      - name: Build APK
        run: flutter build apk --release --split-per-abi
        working-directory: source

      - name: Collect APK
        run: |
          mkdir -p dist
          cp source/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/RuntimeX-android.apk
          shasum -a 256 dist/RuntimeX-android.apk > dist/RuntimeX-android.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: runtimex-android
          path: dist/*
          retention-days: 7

  build-linux:
    name: Build Linux tarball
    runs-on: ubuntu-latest

    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Checkout private RuntimeX source
        uses: actions/checkout@v4
        with:
          repository: garzuu/runtimex
          ref: ${{ inputs.source_ref }}
          path: source
          token: ${{ secrets.RUNTIMEX_SOURCE_TOKEN }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get
        working-directory: source

      - name: Build Linux
        run: flutter build linux --release
        working-directory: source

      - name: Package tarball
        run: |
          mkdir -p dist
          tar -czf dist/RuntimeX-linux.tar.gz \
            -C source/build/linux/x64/release/bundle .
          shasum -a 256 dist/RuntimeX-linux.tar.gz > dist/RuntimeX-linux.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: runtimex-linux
          path: dist/*
          retention-days: 7

  publish:
    name: Publish downloads
    runs-on: ubuntu-latest
    needs:
      - build-macos
      - build-windows
      - build-android
      - build-linux

    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: runtimex-macos
          path: incoming/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: runtimex-windows
          path: incoming/windows

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: runtimex-android
          path: incoming/android

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: runtimex-linux
          path: incoming/linux

      - name: Publish downloads directory
        run: |
          mkdir -p downloads
          cp incoming/macos/RuntimeX-macos.dmg downloads/RuntimeX-macos.dmg
          cp incoming/macos/RuntimeX-macos.dmg.sha256 downloads/RuntimeX-macos.dmg.sha256
          cp incoming/windows/RuntimeX-windows.exe downloads/RuntimeX-windows.exe
          cp incoming/windows/RuntimeX-windows.exe.sha256 downloads/RuntimeX-windows.exe.sha256
          cp incoming/android/RuntimeX-android.apk downloads/RuntimeX-android.apk
          cp incoming/android/RuntimeX-android.apk.sha256 downloads/RuntimeX-android.apk.sha256
          cp incoming/linux/RuntimeX-linux.tar.gz downloads/RuntimeX-linux.tar.gz
          cp incoming/linux/RuntimeX-linux.tar.gz.sha256 downloads/RuntimeX-linux.tar.gz.sha256

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/
          if git diff --cached --quiet; then
            echo "No download changes to publish."
            exit 0
          fi
          git commit -m "feat(downloads): publish RuntimeX binaries"
          git push

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.RUNTIMEX_SOURCE_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          SHA256=$(cut -d' ' -f1 downloads/RuntimeX-macos.dmg.sha256)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/garzuu/homebrew-runtimex.git" tap
          sed -i "s/version \".*\"/version \"${VERSION}\"/" tap/Casks/runtimex.rb
          sed -i "s/sha256 \".*\"/sha256 \"${SHA256}\"/" tap/Casks/runtimex.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/runtimex.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date."
            exit 0
          fi
          git commit -m "chore: update runtimex cask to v${VERSION}"
          git push
